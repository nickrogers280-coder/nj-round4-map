<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NJ Round 4 Sites</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: full-height map console, same system as the JC Board Tracker and NJ Distress Map.
   Sidebar (filters, sites, towns) left, satellite map fills the rest, the site file slides in over the map's right edge.
   Dark by design so pins and tax-map-yellow lot lines read over imagery. */
:root {
  --ground: #121a23;
  --panel: #18222d;
  --panel-2: #1f2b38;
  --line: #2b3a4a;
  --ink: #e7edf3;
  --ink-2: #a3b1bf;
  --ink-3: #74859a;
  --pin: #47c7ec;
  --alert: #ff5c72;
  --ok: #5fd39a;
  --parcel: #ffe066;       /* tax-map yellow, for parcel outlines */
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--pin); }
:focus-visible { outline: 2px solid var(--pin); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 19px; letter-spacing: .01em; white-space: nowrap; }
.brand .sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-data); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.layer-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.layer-toggle button { background: none; border: 0; padding: 6px 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.layer-toggle button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }
.panel-btn { display: none; }

.body { position: relative; display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.filters { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.search { width: 100%; box-sizing: border-box; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.search::placeholder { color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--pin)); }
.chip[aria-pressed="true"] { color: var(--ink); background: var(--panel-2); border-color: color-mix(in srgb, var(--c, var(--pin)) 55%, var(--line)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row select, .row input { flex: 1 1 90px; min-width: 0; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
.row input::placeholder { color: var(--ink-3); }
.filter-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.filter-note button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--ink-2); cursor: pointer; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0; font-family: var(--font-head); font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--ink-3); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pin); }
.tabs .count { font-family: var(--font-data); font-weight: 400; margin-left: 4px; color: var(--ink-3); }
.list { flex: 1; overflow-y: auto; min-height: 0; }
.item { display: grid; gap: 3px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
.item:hover, .item[aria-current="true"] { background: var(--panel-2); }
.item .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.item .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.item .meta { font-size: 12px; color: var(--ink-2); }
.item .num { margin-left: auto; font-family: var(--font-data); font-size: 13px; white-space: nowrap; }
.item .num small { color: var(--ink-3); font-size: 11px; margin-left: 3px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-family: var(--font-head); font-weight: 600; font-size: 11px; letter-spacing: .04em; background: color-mix(in srgb, var(--t, var(--pin)) 22%, transparent); color: var(--t, var(--pin)); white-space: nowrap; }
.empty { padding: 28px 18px; color: var(--ink-3); font-size: 13px; line-height: 1.5; }
.empty b { color: var(--ink-2); }
.foot { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-3); line-height: 1.5; display: flex; gap: 10px; align-items: center; }
.foot button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 11px; color: var(--ink-2); cursor: pointer; margin-left: auto; white-space: nowrap; }

#map { min-height: 0; height: 100%; background: #0b1016; }
.standalone #map { background-image: linear-gradient(#18222d 1px, transparent 1px), linear-gradient(90deg, #18222d 1px, transparent 1px); background-size: 48px 48px; }
.leaflet-container { font-family: var(--font-body); }
.leaflet-control-attribution { background: rgba(18,26,35,.75) !important; color: var(--ink-3) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--line) !important; }
.leaflet-tooltip.site-tip { background: rgba(18,26,35,.94); border: 1px solid var(--line); color: var(--ink); font-size: 12px; box-shadow: none; }
.leaflet-tooltip.site-tip::before { display: none; }
.lot-label { background: rgba(18,26,35,.85); border: 1px solid var(--parcel); color: var(--parcel); font-family: var(--font-head); font-size: 11px; font-weight: 600; padding: 1px 5px; box-shadow: none; }
.lot-label::before { display: none; }

/* pins: one per site, sized by affordable units; overlay and inclusionary zones are diamonds */
.pin { position: relative; display: block; width: 16px; height: 16px; }
.pin i { position: absolute; inset: 0; border-radius: 50%; background: var(--c); border: 2px solid #0b1016; box-shadow: 0 0 0 1.5px var(--c), 0 2px 6px rgba(0,0,0,.6); }
.pin.zone i { border-radius: 3px; transform: rotate(45deg) scale(.9); }
.pin.big { width: 22px; height: 22px; } .pin.huge { width: 30px; height: 30px; }
.pin b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 10px var(--font-data); color: #0b1016; pointer-events: none; }
.pin.huge b { font-size: 11px; }
.pin.selected i { transform: scale(1.35); }
.pin.zone.selected i { transform: rotate(45deg) scale(1.2); }
.pin.prior i { background: #0b1016; border: 2.5px solid var(--c); box-shadow: 0 0 0 1px #0b1016, 0 2px 6px rgba(0,0,0,.6); }
.pin.prior b { color: var(--c); }
.group-h { padding: 12px 14px 6px; font-family: var(--font-head); font-weight: 600; font-size: 12px; letter-spacing: .06em; color: var(--ink-3); border-bottom: 1px solid var(--line); }
.item.off .nm { color: var(--ink-2); }
.now { padding: 10px 12px; border-radius: 8px; background: var(--panel-2); border-left: 3px solid var(--c, #8794a3); font-size: 13px; line-height: 1.5; }
.now b { display: block; font: 600 11px var(--font-head); letter-spacing: .06em; color: var(--ink-3); margin-bottom: 3px; }
.warn { font-size: 12px; color: var(--ink-3); border-left: 3px solid #f0a63a; padding: 6px 10px; background: color-mix(in srgb, #f0a63a 8%, transparent); }

.legend { position: absolute; left: 372px; bottom: 22px; z-index: 800; background: rgba(18,26,35,.9); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11.5px; color: var(--ink-2); display: grid; gap: 4px; }
.legend div { display: flex; align-items: center; gap: 7px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; }
.legend i.dia { border-radius: 2px; transform: rotate(45deg) scale(.85); }
.legend i.ring { background: #0b1016; border: 2px solid var(--ink-2); width: 7px; height: 7px; }
.legend i.lotline { width: 14px; height: 0; border-radius: 0; border-top: 2px dashed var(--parcel); background: none; }

/* site file */
.detail { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 390px; max-width: calc(100% - 24px); z-index: 900;
  display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.55); overflow: hidden; }
.d-head { position: relative; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.d-head .x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: 16px; line-height: 1; }
.d-head h2 { margin: 0; padding-right: 36px; font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 1.2; text-wrap: balance; }
.d-head .where { font-size: 13px; color: var(--ink-2); }
.d-head .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.d-body { overflow-y: auto; padding: 14px 16px 18px; display: grid; gap: 16px; align-content: start; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fig { background: var(--panel-2); border-radius: 8px; padding: 9px 10px; display: grid; gap: 2px; }
.fig span { font-size: 10.5px; color: var(--ink-3); letter-spacing: .04em; }
.fig b { font-family: var(--font-data); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; }
.sec h3 { margin: 0 0 6px; font-family: var(--font-head); font-weight: 600; font-size: 12px; letter-spacing: .06em; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 5px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-data); font-size: 12.5px; }
.lots { display: grid; gap: 6px; }
.lots button { display: flex; justify-content: space-between; gap: 10px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 12.5px; cursor: pointer; }
.lots button:hover, .lots button[aria-current="true"] { border-color: var(--parcel); }
.lots button span:last-child { color: var(--ink-2); text-align: right; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a, .copy { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); text-decoration: none; font-size: 12.5px; cursor: pointer; }
.links a:hover, .copy:hover { border-color: var(--pin); }
.copy { padding: 2px 7px; font-size: 11px; margin-left: 6px; vertical-align: 1px; }
.desc { font-size: 13px; line-height: 1.55; margin: 0; color: var(--ink-2); }
.banner { position: absolute; left: calc(360px + (100% - 360px) / 2); top: 12px; transform: translateX(-50%); z-index: 800; background: rgba(18,26,35,.92); border: 1px solid var(--line); color: var(--ink-2); padding: 6px 12px; border-radius: 6px; font-size: 12px; max-width: calc(100% - 24px); }

@media (max-width: 760px) {
  .brand .sub, .stats .stat:nth-child(n+3) { display: none; }
  .stats { margin-left: 0; gap: 14px; }
  .panel-btn { display: inline-flex; margin-left: auto; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12px; cursor: pointer; }
  .body { grid-template-columns: 1fr; }
  .side { position: absolute; inset: auto 0 0 0; height: 58%; z-index: 850; border-right: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.5); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .side.collapsed { display: none; }
  .detail { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-width: none; height: 72%; }
  .legend { display: none; }
  .banner { left: 50%; top: 8px; width: max-content; max-width: calc(100% - 90px); }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><h1>NJ Round 4 Sites</h1><span class="sub">Sites in adopted Housing Element &amp; Fair Share Plans, mapped by block and lot</span></div>
    <div class="stats" id="stats"></div>
    <div class="layer-toggle" role="group" aria-label="Map style" id="layer-toggle">
      <button id="lyr-sat" aria-pressed="true">Satellite</button>
      <button id="lyr-street" aria-pressed="false">Streets</button>
    </div>
    <button class="panel-btn" id="panel-btn" aria-controls="side">List</button>
  </header>
  <div class="body">
    <aside class="side" id="side">
      <div class="filters">
        <input class="search" id="q" type="search" placeholder="Search site, address, owner, block, town" aria-label="Search">
        <div class="chips" id="round-chips" aria-label="Round"></div>
        <div class="chips" id="mech-chips" aria-label="Compliance mechanism"></div>
        <div class="row">
          <select id="county" aria-label="County"><option value="">All counties</option></select>
          <select id="town" aria-label="Town"><option value="">All towns</option></select>
        </div>
        <div class="row">
          <input id="min-units" type="number" min="0" step="1" placeholder="Min. units" aria-label="Minimum affordable units">
          <input id="min-acres" type="number" min="0" step="0.1" placeholder="Min. acres" aria-label="Minimum acres">
          <select id="status" aria-label="Site status"><option value="">Any status</option></select>
        </div>
        <div class="filter-note" id="filter-note" hidden></div>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-sites" aria-selected="true">Sites<span class="count" id="n-sites"></span></button>
        <button role="tab" id="tab-towns" aria-selected="false">Towns<span class="count" id="n-towns"></span></button>
      </div>
      <div class="list" id="list" role="tabpanel"></div>
      <div class="foot" id="foot"></div>
    </aside>
    <div id="map" aria-label="Map of Round 4 sites"></div>
    <div class="legend" id="legend"></div>
    <section class="detail" id="detail" hidden aria-live="polite"></section>
  </div>
</div>

<!-- The standalone build (pipeline/build_standalone.py) inlines the data here. -->
<script id="embedded-sites" type="application/json"></script>
<script id="embedded-towns" type="application/json"></script>
<script id="embedded-unmapped" type="application/json"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  const STANDALONE = window.ROUND4_STANDALONE === true;   // claude.ai page: outside map tiles are blocked
  const MECHS = [
    { key: "Overlay zone", hex: "#f0a63a", zone: true },
    { key: "Inclusionary zoning", hex: "#ff8f6b", zone: true },
    { key: "Redevelopment", hex: "#c58cff" },
    { key: "100% affordable", hex: "#5fd39a" },
    { key: "Municipally sponsored", hex: "#47c7ec" },
    { key: "Supportive housing", hex: "#ff7ac6" },
    { key: "Existing / credit", hex: "#8794a3" },
    { key: "Other", hex: "#b6c2cf" },
  ];
  const ROUNDS = [
    { key: "Round 4", label: "Round 4", hex: "#e7edf3" },
    { key: "Round 3", label: "Round 3", hex: "#a3b1bf" },
    { key: "Prior (Rounds 1-2)", label: "Rounds 1-2", hex: "#74859a" },
  ];
  const roundOf = (s) => s.p.round || "Round 4";
  const isPrior = (s) => roundOf(s) !== "Round 4";
  const mechOf = (m) => MECHS.find((x) => x.key.toLowerCase() === String(m || "").toLowerCase()) || MECHS[MECHS.length - 1];
  const TOWN_STATUS = {
    "Ready": "#5fd39a", "Ready (2 docs)": "#5fd39a", "Verify": "#f0d24a", "Need base plan": "#f0a63a",
    "Need adopted version": "#ff5c72", "Check for amendment": "#c58cff", "Missing": "#74859a",
  };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n0 = (v) => (v == null || v === "" ? "—" : (+v).toLocaleString("en-US"));
  const money = (v) => (v == null || v === "" ? "—" : "$" + Math.round(+v).toLocaleString("en-US"));
  const short$ = (v) => { if (v == null || v === "") return "—"; v = +v; return v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + "M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + "K" : "$" + v; };
  const titleCase = (s) => String(s || "").toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/\b(Llc|Lp|Inc|Nj|Ny|Us|Ii|Iii)\b/g, (m) => m.toUpperCase()).replace(/\b(\d+)(St|Nd|Rd|Th)\b/g, (m, a, b) => a + b.toLowerCase());
  const saleDate = (s) => { s = String(s || ""); if (!/^\d{6}$/.test(s)) return s; const y = +s.slice(0, 2); return `${s.slice(2, 4)}/${s.slice(4, 6)}/${y > 50 ? 19 : 20}${s.slice(0, 2)}`; };

  let PARCELS = [], SITES = [], TOWNS = [], map, layers = {}, markers = new Map(), lotLayer = null, outline = null, selected = null, tab = "sites";
  const state = { q: "", county: "", town: "", status: "", minUnits: NaN, minAcres: NaN, mechs: new Set(MECHS.map((m) => m.key)), rounds: new Set(ROUNDS.map((r) => r.key)) };
  let UNMAPPED = [];

  // ------------------------------------------------------------ data
  async function load(id, url) {
    const t = document.getElementById(id).textContent.trim();
    if (t) return JSON.parse(t);
    try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return r.json(); } catch {}
    return null;
  }
  function boundsOf(features) { return L.geoJSON({ type: "FeatureCollection", features }).getBounds(); }
  function groupSites() {
    const by = new Map();
    for (const f of PARCELS) {
      const p = f.properties;
      if (!by.has(p.site_id)) by.set(p.site_id, { id: p.site_id, p, lots: [] });
      by.get(p.site_id).lots.push(f);
    }
    SITES = [...by.values()].map((s) => {
      const acres = s.p.site_acres ?? s.lots.reduce((a, f) => a + (f.properties.parcel_acres || 0), 0);
      const value = s.lots.reduce((a, f) => a + (f.properties.net_value || 0), 0);
      const owners = [...new Set(s.lots.map((f) => f.properties.owner).filter(Boolean))];
      const hay = [s.p.site_name, s.p.municipality, s.p.county, s.p.address, s.p.zoning, s.p.mechanism, s.p.notes, ...owners,
        ...s.lots.map((f) => `block ${f.properties.block} lot ${f.properties.lot} ${f.properties.prop_loc || ""} ${f.properties.owner_address || ""}`)].join(" ").toLowerCase();
      const b = boundsOf(s.lots);
      return { ...s, acres, value, owners, hay, bounds: b, center: b.isValid() ? b.getCenter() : null, mech: mechOf(s.p.mechanism) };
    });
    for (const u of UNMAPPED) {
      const hay = [u.site_name, u.municipality, u.county, u.address, u.zoning, u.mechanism, u.notes, u.existing_conditions,
        u.zone && u.zone.applies_to, u.zone && u.zone.zone_code].join(" ").toLowerCase();
      SITES.push({ id: u.site_id, p: u, lots: [], acres: u.site_acres, value: 0, owners: [], hay, bounds: L.latLngBounds([]),
        center: null, mech: mechOf(u.mechanism), unmapped: true, reason: u.unmapped_reason });
    }
    SITES.sort((a, b) => a.p.municipality.localeCompare(b.p.municipality) || (isPrior(a) - isPrior(b)) || a.p.site_name.localeCompare(b.p.site_name));
  }
  function visible(s) {
    const p = s.p;
    if (!state.mechs.has(s.mech.key)) return false;
    if (!state.rounds.has(roundOf(s))) return false;
    if (state.county && p.county !== state.county) return false;
    if (state.town && p.municipality !== state.town) return false;
    if (state.status && p.site_status !== state.status) return false;
    if (!isNaN(state.minUnits) && !((p.affordable_units || 0) >= state.minUnits)) return false;
    if (!isNaN(state.minAcres) && !((s.acres || 0) >= state.minAcres)) return false;
    if (state.q && !state.q.split(/\s+/).every((w) => s.hay.includes(w))) return false;
    return true;
  }

  // ------------------------------------------------------------ map
  function initMap() {
    map = L.map("map", { zoomControl: true, maxZoom: 20 }).setView([40.25, -74.55], 8);
    if (!STANDALONE) {
      const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 20, attribution: "Imagery © Esri, Maxar, Earthstar Geographics" });
      const roads = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 20, opacity: 0.85 });
      const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 20 });
      const street = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 20, attribution: "© OpenStreetMap contributors © CARTO" });
      layers = { satellite: L.layerGroup([sat, roads, labels]), streets: street };
      layers.satellite.addTo(map);
      const setLayer = (k) => {
        Object.values(layers).forEach((l) => map.removeLayer(l));
        layers[k].addTo(map);
        $("#lyr-sat").setAttribute("aria-pressed", k === "satellite");
        $("#lyr-street").setAttribute("aria-pressed", k === "streets");
      };
      $("#lyr-sat").onclick = () => setLayer("satellite");
      $("#lyr-street").onclick = () => setLayer("streets");
    } else {
      $("#layer-toggle").hidden = true;
      const b = document.createElement("div");
      b.className = "banner";
      b.textContent = "Satellite imagery is on the GitHub version of this map. Here, use a site's Google Maps link for aerial context.";
      $(".body").appendChild(b);
    }
    // Every mapped lot, drawn once zoomed in; the selected site's lots get the tax-map-yellow outline.
    lotLayer = L.geoJSON(null, {
      style: (f) => { const c = mechOf(f.properties.mechanism).hex; return { color: c, weight: 1.5, fillColor: c, fillOpacity: 0.25 }; },
      onEachFeature: (f, l) => {
        l.on("click", () => select(f.properties.site_id, false, f.properties.pams_pin));
        l.bindTooltip(`${esc(f.properties.site_name)}<br>Block ${esc(f.properties.block)} · Lot ${esc(f.properties.lot)}`, { sticky: true, className: "site-tip" });
      },
    });
    map.on("zoomend", syncLots);
  }
  function syncLots() {
    const show = map.getZoom() >= 15;
    if (show && !map.hasLayer(lotLayer)) lotLayer.addTo(map);
    if (!show && map.hasLayer(lotLayer)) map.removeLayer(lotLayer);
  }
  function pinIcon(s) {
    const u = s.p.affordable_units || 0;
    const size = u >= 100 ? "huge" : u >= 25 ? "big" : "";
    const px = size === "huge" ? 30 : size === "big" ? 22 : 16;
    const cls = ["pin", size, s.mech.zone ? "zone" : "", isPrior(s) ? "prior" : "", selected === s.id ? "selected" : ""].join(" ");
    return L.divIcon({ className: "", iconSize: [px, px], iconAnchor: [px / 2, px / 2],
      html: `<span class="${cls}" style="--c:${s.mech.hex}"><i></i>${size ? `<b>${u}</b>` : ""}</span>` });
  }
  function drawMarkers() {
    markers.forEach((m) => m.remove());
    markers.clear();
    const vis = SITES.filter(visible);
    for (const s of vis) {
      if (!s.center) continue;
      const m = L.marker(s.center, { icon: pinIcon(s), keyboard: true, title: s.p.site_name, riseOnHover: true }).addTo(map);
      m.on("click", () => select(s.id, false));
      m.bindTooltip(`<b>${esc(s.p.site_name)}</b><br>${esc(s.p.municipality)} · ${isPrior(s) ? esc(roundOf(s)) + " · " : ""}${s.p.affordable_units ?? "—"} affordable`, { direction: "top", offset: [0, -10], className: "site-tip" });
      m._s = s;
      markers.set(s.id, m);
    }
    const ids = new Set(vis.map((s) => s.id));
    lotLayer.clearLayers();
    lotLayer.addData(PARCELS.filter((f) => ids.has(f.properties.site_id)));
    syncLots();
  }

  // ------------------------------------------------------------ sidebar
  function renderStats() {
    const vis = SITES.filter(visible);
    const units = vis.reduce((a, s) => a + (s.p.affordable_units || 0), 0);
    const lots = vis.reduce((a, s) => a + s.lots.length, 0);
    const ready = TOWNS.filter((t) => /^Ready/.test(t.tracker_status || "")).length;
    $("#stats").innerHTML = [
      [n0(vis.length), "sites"], [n0(units), "affordable units"], [n0(lots), "lots"],
      [TOWNS.length ? `${ready}/${TOWNS.length}` : "—", "towns with plan in hand"],
    ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
  }
  function fillSelect(sel, values, keep) {
    const cur = keep ? sel.value : "";
    sel.length = 1;
    values.forEach((v) => sel.add(new Option(v, v)));
    if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
  }
  function renderFilters() {
    $("#round-chips").innerHTML = ROUNDS.map((r) => `<button class="chip" type="button" aria-pressed="true" data-r="${esc(r.key)}" style="--c:${r.hex}"><i></i>${esc(r.label)}</button>`).join("");
    $("#round-chips").querySelectorAll(".chip").forEach((b) => (b.onclick = () => {
      const k = b.dataset.r, on = state.rounds.has(k);
      on ? state.rounds.delete(k) : state.rounds.add(k);
      b.setAttribute("aria-pressed", String(!on));
      refresh();
    }));
    $("#mech-chips").innerHTML = MECHS.map((m) => `<button class="chip" type="button" aria-pressed="true" data-k="${esc(m.key)}" style="--c:${m.hex}"><i></i>${esc(m.key)}</button>`).join("");
    $("#mech-chips").querySelectorAll(".chip").forEach((b) => (b.onclick = () => {
      const k = b.dataset.k, on = state.mechs.has(k);
      on ? state.mechs.delete(k) : state.mechs.add(k);
      b.setAttribute("aria-pressed", String(!on));
      refresh();
    }));
    const counties = [...new Set([...TOWNS.map((t) => t.county), ...SITES.map((s) => s.p.county)])].filter(Boolean).sort();
    fillSelect($("#county"), counties);
    refreshTowns();
    fillSelect($("#status"), [...new Set(SITES.map((s) => s.p.site_status).filter(Boolean))].sort());
  }
  function refreshTowns() {
    const c = $("#county").value;
    const names = [...new Set([...TOWNS.filter((t) => !c || t.county === c).map((t) => t.municipality),
      ...SITES.filter((s) => !c || s.p.county === c).map((s) => s.p.municipality)])].sort();
    fillSelect($("#town"), names, true);
  }
  function renderLegend() {
    $("#legend").innerHTML = MECHS.map((m) => `<div><i class="${m.zone ? "dia" : ""}" style="--c:${m.hex}"></i>${esc(m.key)}</div>`).join("")
      + `<div><i class="ring"></i>Prior-round site (hollow)</div><div><i class="lotline"></i>Selected lots</div>`;
  }
  function renderFoot() {
    $("#foot").innerHTML = `<span>Lots: NJOGIS Parcels &amp; MOD-IV. Sites: each town's adopted plan.</span><button id="csv" type="button">${STANDALONE ? "Copy CSV" : "Download CSV"}</button>`;
    $("#csv").onclick = exportCSV;
  }
  function renderNote() {
    const label = state.town ? state.town : state.county ? state.county + " County" : "";
    const n = $("#filter-note");
    if (!label) { n.hidden = true; return; }
    n.hidden = false;
    n.innerHTML = `Showing ${esc(label)} <button type="button" id="clear-place">Show all towns</button>`;
    $("#clear-place").onclick = () => { $("#county").value = ""; $("#town").value = ""; state.county = state.town = ""; refreshTowns(); refresh(true); };
  }
  function renderList() {
    const vis = SITES.filter(visible);
    const towns = TOWNS.filter((t) => (!state.county || t.county === state.county) && (!state.town || t.municipality === state.town));
    $("#n-sites").textContent = vis.length;
    $("#n-towns").textContent = towns.length;
    $("#tab-sites").setAttribute("aria-selected", tab === "sites");
    $("#tab-towns").setAttribute("aria-selected", tab === "towns");
    const box = $("#list");
    if (tab === "towns") {
      const per = new Map();
      SITES.forEach((s) => { const k = s.p.county + "|" + s.p.municipality; per.set(k, (per.get(k) || 0) + 1); });
      if (!towns.length) { box.innerHTML = `<div class="empty">No towns loaded yet.</div>`; return; }
      box.innerHTML = towns.map((t) => {
        const n = per.get(t.county + "|" + t.municipality) || 0;
        const col = TOWN_STATUS[t.tracker_status] || "#74859a";
        return `<button class="item" type="button" data-town="${esc(t.municipality)}" data-county="${esc(t.county)}">
          <span class="top"><span class="dot" style="--c:${col}"></span><span class="nm">${esc(t.municipality)}</span><span class="num">${n || "—"}<small>${n === 1 ? "site" : "sites"}</small></span></span>
          <span class="meta">${esc(t.county)} · <span class="tag" style="--t:${col}">${esc(t.tracker_status || "Unknown")}</span>${t.latest_adoption ? " · " + esc(t.latest_adoption) : ""}</span>
        </button>`;
      }).join("");
      box.querySelectorAll(".item").forEach((b) => (b.onclick = () => {
        $("#county").value = b.dataset.county; state.county = b.dataset.county; refreshTowns();
        $("#town").value = b.dataset.town; state.town = b.dataset.town;
        tab = "sites"; refresh(true);
      }));
      return;
    }
    if (!SITES.length) {
      box.innerHTML = `<div class="empty"><b>No mapped sites yet.</b><br>Sites appear here as they're pulled from each town's adopted plan and matched to tax lots.</div>`;
      return;
    }
    if (!vis.length) {
      box.innerHTML = `<div class="empty">No sites match these filters.<br><br><button class="chip" id="reset-empty" type="button">Clear filters</button></div>`;
      $("#reset-empty").onclick = resetFilters;
      return;
    }
    const row = (s) => {
      const p = s.p;
      const where = s.unmapped ? esc(s.reason || "Not located yet") : `${s.lots.length} lot${s.lots.length === 1 ? "" : "s"}${s.acres ? " · " + (+s.acres).toFixed(2) + " ac" : ""}`;
      return `<button class="item ${s.unmapped ? "off" : ""}" type="button" data-id="${esc(s.id)}" aria-current="${selected === s.id}">
        <span class="top"><span class="dot" style="--c:${s.mech.hex}"></span><span class="nm">${esc(p.site_name)}</span><span class="num">${p.affordable_units ?? "—"}<small>aff.</small></span></span>
        <span class="meta">${isPrior(s) ? `<span class="tag" style="--t:#a3b1bf">${esc(roundOf(s))}</span> ` : ""}${esc(p.municipality)}, ${esc(p.county)} · ${where}</span>
        <span class="meta">${esc(p.mechanism || "Other")}${p.max_density_du_ac ? " · " + p.max_density_du_ac + " du/ac" : ""}${p.site_status ? " · " + esc(p.site_status) : ""}</span>
      </button>`;
    };
    const on = vis.filter((s) => !s.unmapped), off = vis.filter((s) => s.unmapped);
    box.innerHTML = on.map(row).join("") + (off.length ? `<div class="group-h">Not on the map yet · ${off.length}</div>` + off.map(row).join("") : "");
    box.querySelectorAll(".item").forEach((b) => (b.onclick = () => select(b.dataset.id, true)));
  }

  // ------------------------------------------------------------ site file
  function renderDetail(s, pin) {
    const p = s.p;
    const f = s.lots.find((x) => x.properties.pams_pin === pin) || s.lots[0];
    const q = f ? f.properties : null;
    const z = p.zone;
    const zoneRows = z ? [
      ["Applies to", z.applies_to], ["Permitted uses", z.permitted_uses],
      ["Max density", z.max_density_du_ac != null ? z.max_density_du_ac + " units / acre" : ""], ["Max units", z.max_units != null ? n0(z.max_units) : ""],
      ["Set-aside", z.set_aside], ["Min. lot area", z.min_lot_area], ["Min. frontage", z.min_frontage], ["Max. height", z.max_height],
      ["Building cover", z.max_building_coverage], ["Impervious", z.max_impervious_coverage], ["Setbacks", z.setbacks], ["Parking", z.parking],
      ["Also", z.other_standards], ["Ordinance", z.ordinance_status], ["Source", (z.plan_doc || "") + (z.plan_page ? ", p. " + z.plan_page : "")],
    ].filter((r) => r[1] != null && String(r[1]).trim() !== "") : [];
    const zoneTitle = z ? `${isPrior(s) ? esc(z.round || roundOf(s)) + " zoning" : "Round 4 zoning"}${z.zone_code ? ": " + esc(z.zone_code) : ""}` : "";
    const ll = s.center ? `${s.center.lat.toFixed(6)},${s.center.lng.toFixed(6)}` : "";
    const lotList = s.lots.map((x) => `Block ${x.properties.block} Lot ${x.properties.lot}`).join("; ");
    const density = p.total_units && s.acres ? Math.round(p.total_units / s.acres) : null;
    $("#detail").innerHTML = `
      <div class="d-head">
        <button class="x" id="d-close" type="button" aria-label="Close">×</button>
        <h2>${esc(p.site_name)}</h2>
        <div class="where">${esc(p.municipality)}, ${esc(p.county)} County${p.address ? " · " + esc(p.address) : ""}</div>
        <div class="tags"><span class="tag" style="--t:${isPrior(s) ? "#a3b1bf" : "#e7edf3"}">${esc(roundOf(s))}</span><span class="tag" style="--t:${s.mech.hex}">${esc(p.mechanism || "Other")}</span>${p.site_status ? `<span class="tag" style="--t:#a3b1bf">${esc(p.site_status)}</span>` : ""}</div>
      </div>
      <div class="d-body">
        <div class="figs">
          <div class="fig"><span>Affordable</span><b>${n0(p.affordable_units)}</b></div>
          <div class="fig"><span>Total units</span><b>${n0(p.total_units)}</b></div>
          <div class="fig"><span>Max density</span><b>${p.max_density_du_ac != null ? p.max_density_du_ac + "/ac" : "—"}</b></div>
          <div class="fig"><span>Site acres</span><b>${s.acres ? (+s.acres).toFixed(2) : "—"}</b></div>
          <div class="fig"><span>Lots</span><b>${s.lots.length}</b></div>
          <div class="fig"><span>Assessed</span><b>${s.value ? short$(s.value) : "—"}</b></div>
        </div>
        ${p.existing_conditions ? `<div class="now" style="--c:${s.mech.hex}"><b>${isPrior(s) ? "What's there now" : "Current use"}</b>${esc(p.existing_conditions)}</div>` : ""}
        ${s.unmapped ? `<p class="warn">Not on the map yet: ${esc(s.reason || "no lots located")}.${p.blocks_lots ? " Listed as " + esc(p.blocks_lots) + "." : ""}</p>` : ""}
        ${z ? `<div class="sec"><h3>${zoneTitle}</h3>${z.zone_name ? `<p class="desc" style="margin:0 0 8px">${esc(z.zone_name)}</p>` : ""}<dl class="kv">${zoneRows.map((r) => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></div>` : ""}
        <div class="sec"><h3>From the plan</h3><dl class="kv">
          ${p.set_aside && !(z && z.set_aside === p.set_aside) ? `<dt>Set-aside</dt><dd>${esc(p.set_aside)}</dd>` : ""}
          ${p.zoning ? `<dt>Zoning</dt><dd>${esc(p.zoning)}</dd>` : ""}
          ${p.site_status ? `<dt>Status</dt><dd>${esc(p.site_status)}</dd>` : ""}
          ${density ? `<dt>Implied density</dt><dd>${density} units / acre</dd>` : ""}
          <dt>Source</dt><dd>${esc(p.plan_doc) || "—"}${p.plan_page ? `, p. ${esc(p.plan_page)}` : ""}</dd>
        </dl></div>
        ${p.notes ? `<p class="desc">${esc(p.notes)}</p>` : ""}
        ${q ? `<div class="sec"><h3>Block ${esc(q.block)} · Lot ${esc(q.lot)}<button class="copy" type="button" data-copy="Block ${esc(q.block)}, Lot ${esc(q.lot)}">Copy</button></h3><dl class="kv">
          <dt>Location</dt><dd>${esc(titleCase(q.prop_loc)) || "—"}</dd>
          <dt>Owner</dt><dd>${q.owner ? esc(q.owner) + (q.owner_source ? `<br><small style="color:var(--ink-3)">Tax record: ${esc(q.owner_source)}</small>` : "") : `<span style="color:var(--ink-3)">Not pulled yet for this county</span>`}</dd>
          <dt>Owner mailing</dt><dd>${esc(titleCase(q.owner_address)) || "—"}</dd>
          <dt>Lot acres</dt><dd>${q.parcel_acres ?? "—"}</dd>
          <dt>Class</dt><dd class="mono">${esc(q.prop_class) || "—"}${q.building ? " · " + esc(q.building) : ""}</dd>
          <dt>Assessed (net)</dt><dd>${money(q.net_value)}</dd>
          <dt>Land / improv.</dt><dd>${money(q.land_value)} / ${money(q.improvement_value)}</dd>
          ${q.year_built ? `<dt>Year built</dt><dd>${esc(q.year_built)}</dd>` : ""}
          ${q.last_sale_price > 1 ? `<dt>Last sale</dt><dd>${money(q.last_sale_price)}${q.last_sale_date ? " · " + esc(saleDate(q.last_sale_date)) : ""}</dd>` : ""}
        </dl>${q.located_by === "address" ? `<p class="note" style="font-size:12px;color:var(--ink-3);margin:6px 0 0">Located by street address; the plan gives no block/lot.</p>` : ""}</div>` : ""}
        ${s.lots.length > 1 ? `<div class="sec"><h3>All ${s.lots.length} lots<button class="copy" type="button" data-copy="${esc(lotList)}">Copy list</button></h3><div class="lots">${s.lots.map((x) => {
          const r = x.properties;
          return `<button type="button" data-pin="${esc(r.pams_pin)}" aria-current="${q && r.pams_pin === q.pams_pin}"><span class="mono">${esc(r.block)} · ${esc(r.lot)}</span><span>${esc(titleCase(r.prop_loc || ""))}${r.parcel_acres ? " · " + r.parcel_acres + " ac" : ""}</span></button>`;
        }).join("")}</div></div>` : ""}
        <div class="links">
          ${ll ? `<a href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank" rel="noopener">Google Maps</a>
          <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}" target="_blank" rel="noopener">Street View</a>` : ""}
          ${p.plan_url ? `<a href="${esc(p.plan_url)}" target="_blank" rel="noopener">Plan document</a>` : ""}
        </div>
      </div>`;
    $("#d-close").onclick = closeDetail;
    $("#detail").querySelectorAll(".copy").forEach((b) => {
      const label = b.textContent;
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch { b.textContent = "Select the text to copy"; }
        setTimeout(() => (b.textContent = label), 1500);
      };
    });
    $("#detail").querySelectorAll(".lots button").forEach((b) => (b.onclick = () => select(s.id, false, b.dataset.pin)));
  }
  function select(id, fly, pin) {
    const s = SITES.find((x) => x.id === id);
    if (!s) return;
    const prev = selected;
    selected = id;
    [prev, id].forEach((sid) => { const m = markers.get(sid); if (m) m.setIcon(pinIcon(m._s)); });
    renderDetail(s, pin);
    $("#detail").hidden = false;
    $("#detail").querySelector(".d-body").scrollTop = 0;
    const mobile = window.matchMedia("(max-width: 760px)").matches;
    if (mobile) $("#side").classList.add("collapsed");
    renderList();
    if (s.lots.length) drawOutline(s, pin); else if (outline) { outline.remove(); outline = null; }
    if (!pin && s.bounds.isValid()) {
      const opts = mobile ? { paddingTopLeft: [30, 30], paddingBottomRight: [30, map.getSize().y * 0.7], maxZoom: 18 }
                          : { paddingTopLeft: [40, 40], paddingBottomRight: [430, 40], maxZoom: 18 };
      fly ? map.flyToBounds(s.bounds, { ...opts, duration: 1.1 }) : map.fitBounds(s.bounds, opts);
    }
    try { history.replaceState(null, "", "#" + id); } catch {}
  }
  function drawOutline(s, pin) {
    if (outline) outline.remove();
    outline = L.geoJSON({ type: "FeatureCollection", features: s.lots }, {
      interactive: false,
      style: (f) => {
        const on = !pin || f.properties.pams_pin === pin;
        return { color: "#ffe066", weight: on ? 2.5 : 1.5, fillColor: "#ffe066", fillOpacity: on ? 0.14 : 0.04, dashArray: "6 4" };
      },
      onEachFeature: (f, layer) => layer.bindTooltip(`${f.properties.block} · ${f.properties.lot}`, { permanent: true, direction: "center", className: "lot-label" }),
    }).addTo(map);
  }
  function closeDetail() {
    const prev = selected;
    selected = null;
    $("#detail").hidden = true;
    if (outline) { outline.remove(); outline = null; }
    const m = markers.get(prev); if (m) m.setIcon(pinIcon(m._s));
    renderList();
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  }

  // ------------------------------------------------------------ actions
  function refresh(zoomTo) {
    renderNote(); drawMarkers(); renderStats(); renderList();
    if (zoomTo) {
      const vis = SITES.filter(visible).filter((s) => s.bounds.isValid());
      if (vis.length) {
        const b = vis.reduce((acc, s) => acc.extend(s.bounds), L.latLngBounds(vis[0].bounds.getSouthWest(), vis[0].bounds.getNorthEast()));
        map.fitBounds(b.pad(0.2), { maxZoom: 17 });
      }
    }
  }
  function resetFilters() {
    Object.assign(state, { q: "", county: "", town: "", status: "", minUnits: NaN, minAcres: NaN, mechs: new Set(MECHS.map((m) => m.key)), rounds: new Set(ROUNDS.map((r) => r.key)) });
    ["#q", "#county", "#town", "#status", "#min-units", "#min-acres"].forEach((sel) => ($(sel).value = ""));
    $("#mech-chips").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "true"));
    $("#round-chips").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "true"));
    refreshTowns(); refresh();
  }
  function exportCSV() {
    const cols = ["county", "municipality", "round", "site_name", "mechanism", "zone_code", "existing_conditions", "affordable_units", "total_units", "max_density_du_ac", "set_aside", "zoning",
      "site_status", "block", "lot", "prop_loc", "owner", "owner_address", "parcel_acres", "net_value", "plan_doc", "plan_page"];
    const ids = new Set(SITES.filter(visible).map((s) => s.id));
    const rows = PARCELS.filter((f) => ids.has(f.properties.site_id)).map((f) => cols.map((c) => {
      const v = c === "zone_code" ? ((f.properties.zone || {}).zone_code || "") : (f.properties[c] ?? ""); return /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
    }).join(","));
    const text = [cols.join(","), ...rows].join("\n");
    const btn = $("#csv");
    if (STANDALONE) {
      navigator.clipboard.writeText(text).then(() => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy CSV"), 1600); }).catch(() => { btn.textContent = "Copy failed"; });
      return;
    }
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([text], { type: "text/csv" })), download: "round4-sites.csv" });
    document.body.appendChild(a); a.click(); a.remove();
  }
  function wire() {
    $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); refresh(); });
    $("#county").addEventListener("change", (e) => { state.county = e.target.value; state.town = ""; $("#town").value = ""; refreshTowns(); refresh(true); });
    $("#town").addEventListener("change", (e) => { state.town = e.target.value; refresh(true); });
    $("#status").addEventListener("change", (e) => { state.status = e.target.value; refresh(); });
    $("#min-units").addEventListener("input", (e) => { state.minUnits = parseFloat(e.target.value); refresh(); });
    $("#min-acres").addEventListener("input", (e) => { state.minAcres = parseFloat(e.target.value); refresh(); });
    $("#tab-sites").onclick = () => { tab = "sites"; renderList(); };
    $("#tab-towns").onclick = () => { tab = "towns"; renderList(); };
    $("#panel-btn").onclick = () => $("#side").classList.toggle("collapsed");
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) closeDetail(); });
  }

  async function start() {
    if (STANDALONE) document.body.classList.add("standalone");
    const geo = await load("embedded-sites", "data/sites.geojson");
    const tw = await load("embedded-towns", "data/municipalities.json");
    const um = await load("embedded-unmapped", "data/unmapped.json");
    UNMAPPED = (um && um.items) || [];
    PARCELS = (geo && geo.features) || [];
    TOWNS = ((tw && tw.municipalities) || []).slice().sort((a, b) => a.county.localeCompare(b.county) || a.municipality.localeCompare(b.municipality));
    initMap();
    groupSites();
    wire();
    renderFilters(); renderLegend(); renderFoot();
    refresh();
    const all = SITES.filter((s) => s.bounds.isValid());
    if (all.length) {
      const b = all.reduce((acc, s) => acc.extend(s.bounds), L.latLngBounds(all[0].bounds.getSouthWest(), all[0].bounds.getNorthEast()));
      map.fitBounds(b.pad(0.3), { maxZoom: 16, paddingBottomRight: [0, 0] });
    }
    if (window.matchMedia("(max-width: 760px)").matches) $("#side").classList.add("collapsed");
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && SITES.some((s) => s.id === h)) select(h, false);
  }
  start();
})();
</script>
</body>
</html>
