name: Probe courts
on:
  push:
    branches: [probe-courts]
    paths: [probe/courts.sh]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash probe/courts.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out && git commit -m "probe output" && git push
