name: Map sites

# Looks up every block/lot in data/sites.csv in NJ's statewide parcel layer
# and rebuilds docs/data/sites.geojson for the map.
on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Re-query every parcel (ignore cached lookups)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - data/sites.csv
      - data/municipalities.csv
      - pipeline/**

permissions:
  contents: write

concurrency:
  group: map-sites
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore parcel lookup cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: parcels-${{ hashFiles('data/sites.csv') }}
          restore-keys: parcels-
      - name: Match block/lots to parcels
        run: python pipeline/geocode_sites.py ${{ inputs.no_cache && '--no-cache' || '' }}
      - name: Show unmatched block/lots
        run: column -s, -t < docs/data/unmatched.csv || cat docs/data/unmatched.csv
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update mapped sites"
          git push
